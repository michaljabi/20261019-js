<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        button {
            margin-top: 10px;
            border: 1px solid black;
            padding: 15px;
            background-color: #4fb2ff;
            cursor: pointer;
            font-size: 3rem;
            border-radius: .5rem;
        }
        button:hover {
            background-color: #0e48ff;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div>
        <button id="sampleBtn"> TOGGLE </button>
    </div>
    <div>
        <button id="dontClickMeBtn"> Don't click me! </button>
    </div>
    <script>

        const btn1 = document.getElementById('sampleBtn');
        const btn2 = document.getElementById('dontClickMeBtn');

        const TEXT1 = 'Don\'t click me!';
        const TEXT2 = 'Or should you click?';

        // console.log()
        // Michał z przyszłości (jutro)
        //let x = Number(localStorage.getItem('x')) || 0;
        // teraz:
        let x = 1;

        btn1.addEventListener('click', () => {
            // console.log('Gdzie ja jestem?')
            // console.log('?')
            // console.warn('JESTEM')
            // console.error('UWAGA')
            // debugger;
            // x++;
            console.log(x++);
            //localStorage.setItem('x', x)

            if(btn1.innerText === TEXT1) {
                const x = 200;
                btn1.innerText = TEXT2;
            } else {
                btn1.innerText = TEXT1
            }
        })


        // Callback (umowna nazwa) funkcji która jest przyjmowana
        // przez inną metodę lub funkcję
        const myEventClickRef = () => {
            alert('I said - do not click me !')
        };
        btn2.addEventListener('click', myEventClickRef)


        //pod spodem, w momencie CLIK zrobi myEventClickRef()
    </script>
</body>
</html>
